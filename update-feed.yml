name: Update Corridor ID news feed

on:
  schedule:
    # Runs at 13:00 UTC daily (~8am Central). Adjust as you like.
    - cron: "0 13 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser feedgen requests

      - name: Build feed
        run: python scripts/build_feed.py

      - name: Commit updated feed
        run: |
          git config user.name "corridor-id-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/feed.xml docs/feed.json
          git diff --cached --quiet || git commit -m "Update Corridor ID news feed"
          git push
